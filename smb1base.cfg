MEMORY {
    ZP:     start = $00,    size = $0100, type = rw, file = "";
    SP:     start = $0100,  size = $0100, type = rw, file = "";
    OAM:    start = $0200,  size = $0100, type = rw, file = "";
    RAM:    start = $0300,  size = $0500, type = rw, file = "";
    SRAM_00:start = $6000,  size = $2000, type = rw, file = "";

    HDR:    start = $0000,  size = $0010, type = ro, file = %O, fill = yes, fillval = $00;

    PRGA_00:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $00;
    PRGA_01:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $01;
    PRGA_02:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $02;
    PRGA_03:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $03;
    PRGA_04:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $04;
    PRGA_05:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $05;
    PRGA_06:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $06;
    PRGA_07:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $07;
    PRGA_08:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $08;
    PRGA_09:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $09;
    PRGA_0a:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $0a;
    PRGA_0b:start = $a000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $0b;

    # blank space in my hack. i've set it up for bankable dpcm though
    PRGC_00:start = $c000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $0c;
    PRGC_01:start = $c000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $0d;

    SAM_AUDIO_0:start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $0e;
    SAM_AUDIO_1:start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $0f;
    SAM_AUDIO_2:start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $10;
    SAM_AUDIO_4:start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $11;
    SAM_AUDIO_5:start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $12;
    BILL_GFX_MEM:start = $c000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $13;
    LINK_GFX_MEM:start = $c000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $14;
    SIMON_GFX_MEM:start = $c000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $15;
    ROSTER_MEM:start = $a000, size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $16;
    CONTRA_MEM:start=$a000, size=$3c00, type=ro, file=%O, fill=yes, fillval=$ff, bank=$17;
    CONTRA_WRAP_MEM:start=$dc00, size=$400, type=ro, file=%O, fill=yes, fillval=$ff, bank=$18;
    ZELDA_MEM:start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$19;
    ZELDA_WRAP_MEM:start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$1a;
    CV_MEM:start=$a000, size=$3c00, type=ro, file=%O, fill=yes, fillval=$ff, bank=$1b;
    CV_WRAP_MEM:start=$dc00, size=$400, type=ro, file=%O, fill=yes, fillval=$ff, bank=$1c;
    PRG_EXTRA:start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$1d;

    XG_CODE_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$1e;
    XG_PIT_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$1f;
    XG_RYGAR_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$20;
    XG_LUIGI_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$21;
    XG_BASS_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$22;
    XG_RYU_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$23;
    XG_SOPHIA_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$24;
    XG_EXTRA_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$25;
    XG_AUDIO_MEM: start=$c000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$26;
    XG_MUSIC_27_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$27;
    XG_MUSIC_28_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$28;
    XG_MUSIC_29_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$29;
    XG_MUSIC_2A_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$2a;
    XG_MUSIC_2B_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$2b;
    XG_MUSIC_2C_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$2c;
    XG_MUSIC_2D_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$2d;
    XG_MUSIC_2E_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$2e;
    XG_MUSIC_2F_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$2f;
    XG_MUSIC_30_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$30;
    XG_MUSIC_31_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$31;
    XG_MUSIC_32_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$32;
    XG_MUSIC_33_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$33;
    XG_MUSIC_34_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$34;
    XG_MUSIC_35_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$35;
    XG_MUSIC_36_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$36;
    XG_MUSIC_37_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$37;
    XG_MUSIC_38_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$38;
    XG_MUSIC_39_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$39;
    XG_MUSIC_3A_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$3a;
    XG_MUSIC_3B_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$3b;
    XG_MUSIC_3C_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$3c;
    XG_MUSIC_3D_MEM: start=$a000, size=$2000, type=ro, file=%O, fill=yes, fillval=$ff, bank=$3d;

    PRGLow: start = $8000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $ff, bank = $3e;
    
    ALIGN:  start = $e000,  size = $60,   type = ro, file = %O, fill = yes, bank = $3f;
    PRGFix: start = $e060,  size = $2000 - $60, type = ro, file = %O, fill = yes, fillval = $ff, bank = $3f;

    CHR:    start = $0000,  size = $40000, type = ro, fill = yes, file = %O, fillval = $00;
}

SEGMENTS {
    INESHDR:    load = HDR,     type = ro;
    ZEROPAGE:   load = ZP,      type = zp;
    SHORTRAM:   load = SP,      type = bss;
    SMCCODE:    load = PRGA_01, type = rw,  run = SP,     define = yes;
    OAM:        load = OAM,     type = bss;
    BSS:        load = RAM,     type = bss;
    SRAM:       load = SRAM_00, type = bss, optional=yes, align=$100;

    EXPANDED: load=XG_CODE_MEM, type=ro, optional=yes;
    XG_PIT_GFX: load=XG_PIT_MEM, type=ro, optional=yes;
    BILL_ORBIT_1: load=XG_PIT_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    XG_RYGAR_GFX: load=XG_RYGAR_MEM, type=ro, optional=yes;
    BILL_ORBIT_0: load=XG_RYGAR_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    XG_LUIGI_GFX: load=XG_LUIGI_MEM, type=ro, optional=yes;
    BILL_ORBIT_5: load=XG_LUIGI_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    XG_BASS_GFX: load=XG_BASS_MEM, type=ro, optional=yes;
    XG_RYU_GFX: load=XG_RYU_MEM, type=ro, optional=yes;
    BILL_ORBIT_3: load=XG_RYU_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    XG_SOPHIA_GFX: load=XG_SOPHIA_MEM, type=ro, optional=yes;
    EXPANDED_EX: load=XG_EXTRA_MEM, type=ro, optional=yes;
    XG_AUDIO: load=XG_AUDIO_MEM, type=ro, optional=yes;
    BILL_ORBIT_2: load=XG_AUDIO_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    XG_MUSIC_27: load=XG_MUSIC_27_MEM, type=ro, optional=yes;
    XG_MUSIC_28: load=XG_MUSIC_28_MEM, type=ro, optional=yes;
    XG_MUSIC_29: load=XG_MUSIC_29_MEM, type=ro, optional=yes;
    XG_MUSIC_2A: load=XG_MUSIC_2A_MEM, type=ro, optional=yes;
    XG_MUSIC_2B: load=XG_MUSIC_2B_MEM, type=ro, optional=yes;
    XG_MUSIC_2C: load=XG_MUSIC_2C_MEM, type=ro, optional=yes;
    XG_MUSIC_2D: load=XG_MUSIC_2D_MEM, type=ro, optional=yes;
    XG_MUSIC_2E: load=XG_MUSIC_2E_MEM, type=ro, optional=yes;
    XG_MUSIC_2F: load=XG_MUSIC_2F_MEM, type=ro, optional=yes;
    XG_MUSIC_30: load=XG_MUSIC_30_MEM, type=ro, optional=yes;
    XG_MUSIC_31: load=XG_MUSIC_31_MEM, type=ro, optional=yes;
    XG_MUSIC_32: load=XG_MUSIC_32_MEM, type=ro, optional=yes;
    XG_MUSIC_33: load=XG_MUSIC_33_MEM, type=ro, optional=yes;
    XG_MUSIC_34: load=XG_MUSIC_34_MEM, type=ro, optional=yes;
    XG_MUSIC_35: load=XG_MUSIC_35_MEM, type=ro, optional=yes;
    XG_MUSIC_36: load=XG_MUSIC_36_MEM, type=ro, optional=yes;
    XG_MUSIC_37: load=XG_MUSIC_37_MEM, type=ro, optional=yes;
    XG_MUSIC_38: load=XG_MUSIC_38_MEM, type=ro, optional=yes;
    XG_MUSIC_39: load=XG_MUSIC_39_MEM, type=ro, optional=yes;
    XG_MUSIC_3A: load=XG_MUSIC_3A_MEM, type=ro, optional=yes;
    SOPHIA_BODY_COLD: load=XG_MUSIC_3A_MEM, type=ro, optional=yes;
    INVENTORY: load=XG_MUSIC_3B_MEM, type=ro, optional=yes;
    SPECIAL_MM: load=XG_MUSIC_3C_MEM, type=ro, optional=yes;
    SPECIAL_ROSTER: load=XG_MUSIC_3D_MEM, type=ro, optional=yes;
    REMAINING_AUDIO: load=PRGA_07, type=ro, optional=yes;
    SPECIAL_EXTRA: load=PRGA_06, type=ro, optional=yes;

    # User created code defaults to the first A0 bank
    OBJECT:     load = PRGA_00, type = ro;
    # Add an extra bank for object code since its almost full
    OBJECT_EX:  load = PRGA_07, type = ro;
    LINK_HEAD_COLD: load = PRGA_07, type = ro, optional=yes;
    SOPHIA_LAND_AUDIO: load = PRGA_07, type = ro, optional=yes; # Final47B tail; preserve earlier code PCs.
    PLAYER:     load = PRGA_01, type = ro;
    LEVEL:      load = PRGA_02, type = ro;
    TITLE:      load = PRGA_03, type = ro;
    RENDER:     load = PRGA_03, type = ro;
    METASPRITE: load = PRGA_04, type = ro;

    # Famitracker Music Segments
    MUSIC:              load = PRGA_05, type = ro, define = yes, optional = yes;

    # Famistudio Music Segments
    MUSIC_overworld:    load = PRGA_05, type = ro, define = yes, optional = yes;
    MUSIC_underworld:   load = PRGA_05, type = ro, define = yes, optional = yes;
    MUSIC_waterworld:   load = PRGA_05, type = ro, define = yes, optional = yes;
    MUSIC_castleworld:  load = PRGA_05, type = ro, define = yes, optional = yes;
    MUSIC_cloud:        load = PRGA_05, type = ro, define = yes, optional = yes;
    MUSIC_enter_in_a_pipe:      load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_starman:      load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_death:        load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_game_over:    load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_you_saved_the_princess:   load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_in_an_other_castle:   load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_victory:      load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_hurry_up:     load = PRGA_06, type = ro, define = yes, optional = yes;
    MUSIC_new_song:     load = PRGA_06, type = ro, define = yes, optional = yes;

    SOPHIA_TERRAIN_COLD: load=PRGA_05, type=ro, optional=yes; # Verified trailing bank5 FF span after music.
    MM2_AUDIO:        load = PRGA_09, type = ro, optional=yes;
    BILL_BODY_COLD: load=PRGA_09, type=ro, optional=yes; # Explicit source-body code in old FF after unchanged MM2_AUDIO.
    MM3_AUDIO:        load = PRGA_0b, type = ro, optional=yes;
    LEGACY_COLD:      load = PRGA_0b, type = ro, optional=yes;
    SAMUS:           load = PRGA_0a, type = ro, optional=yes;
    SAMUS_GFX:       load = PRGC_01, type = ro, optional=yes;
    BILL_GFX:        load = BILL_GFX_MEM, type = ro, optional=yes;
    LINK_GFX:        load = LINK_GFX_MEM, type = ro, optional=yes;
    BILL_ORBIT_6: load=LINK_GFX_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    SIMON_GFX:       load = SIMON_GFX_MEM, type = ro, optional=yes;
    BILL_ORBIT_4: load=SIMON_GFX_MEM, type=ro, optional=yes; # Existing C000 FF tail; all prior data fixed.
    ROSTER:          load = ROSTER_MEM, type = ro, optional=yes;
    GUEST_AUDIO:     load = PRG_EXTRA, type = ro, optional=yes;
    WATER:           load = PRG_EXTRA, type = ro, optional=yes;
    CHAR_SELECT:     load = PRG_EXTRA, type = ro, optional=yes;
    CONTRA_AUDIO: load=CONTRA_MEM, type=ro, optional=yes;
    CONTRA_WRAP: load=CONTRA_WRAP_MEM, type=ro, optional=yes;
    ZELDA_AUDIO: load=ZELDA_MEM, type=ro, optional=yes;
    BILL_COLD: load=ZELDA_MEM, type=ro, optional=yes; # Append only into verified audio-bank FF tail.
    RYU_COLD: load=ZELDA_MEM, type=ro, optional=yes;
    ZELDA_WRAP: load=ZELDA_WRAP_MEM, type=ro, start=$dc00, optional=yes;
    CV_AUDIO: load=CV_MEM, type=ro, optional=yes;
    CV_WRAP: load=CV_WRAP_MEM, type=ro, optional=yes;
    METROID_AUDIO_0: load = SAM_AUDIO_0, type = ro, optional=yes;
    METROID_AUDIO_1: load = SAM_AUDIO_1, type = ro, optional=yes;
    METROID_AUDIO_2: load = SAM_AUDIO_2, type = ro, optional=yes;
    METROID_AUDIO_4: load = SAM_AUDIO_4, type = ro, optional=yes;
    METROID_AUDIO_5: load = SAM_AUDIO_5, type = ro, optional=yes;
    GUEST_GFX:        load = PRGC_00, type = ro, optional=yes;
    GUEST:            load = PRGA_08, type = ro, optional=yes;
    DPCM_BANK0:       load = PRGC_00, type = ro, optional=yes;
    DPCM_BANK1:       load = PRGC_01, type = ro, optional=yes;

    CODE:       load = PRGLow,  type = ro;
    LOWCODE:    load = PRGLow,  type = ro;
    COLLISION:  load = PRGLow,  type = ro;
    SAMUS_FREEZE_LOW: load = PRGLow, type = ro, optional=yes;

    FIXED:      load = PRGFix,  type = ro;
    SAMUS_CROUCH_WATER: load = PRGFix, type = ro, optional=yes;
    SAMUS_FREEZE_STORE: load = PRGFix, type = ro, optional=yes;
    BASS_DPCM:  load = PRGFix,  type = ro, align=$40, optional=yes;
    SAMUS_CROUCH_BODY: load = PRGFix, type = ro, optional=yes;
    OAMALIGNED: load = ALIGN,   type = ro;
    SAMUS_FREEZE_NMI: load = ALIGN, type = ro, optional=yes;
    
    VECTORS:    load = PRGFix, type = ro,  start = $fffa;

    CHR:        load = CHR,     type = ro;
    
    # segments used by C code
    ONCE:     load = PRGLow,            type = ro,  optional = yes;
    RODATA:   load = PRGLow,            type = ro,  define   = yes;
    DATA:     load = PRGLow, run = RAM, type = rw,  define   = yes;

    # Share the memory in the ZP temp values with famistudio
    MUSIC_ZEROPAGE_OVERLAY:   load = ZP, start=$00, type = overwrite, optional = yes;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $20; # 32 bytes of stack
}
